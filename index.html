<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>네온 테트리스</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --grid-color: #16213e;
            --text-color: #e94560;
            --neon-blue: #00fff5;
            --neon-pink: #ff00de;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            align-items: flex-start;
        }

        canvas {
            border: 2px solid #333;
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.1);
            border-radius: 4px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 120px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        #next-piece-canvas {
            display: block;
            margin: 0 auto;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        /* Controls */
        .controls-area {
            margin-top: 20px;
            display: none; /* Desktop default */
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            justify-items: center;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: background 0.1s;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        .btn-large {
            width: 100%;
            border-radius: 30px;
            background: rgba(233, 69, 96, 0.2);
            border-color: var(--text-color);
        }
        
        /* Modal */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal h1 {
            font-size: 3rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 10px;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .start-btn:hover {
            background: var(--neon-blue);
            color: #000;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
            .sidebar {
                flex-direction: row;
                width: 100%;
                justify-content: center;
                min-width: auto;
            }
            .info-box {
                flex: 1;
                padding: 5px;
            }
            .info-value {
                font-size: 1.2rem;
            }
            .controls-area {
                display: flex;
            }
            canvas {
                width: 200px; /* Smaller on mobile */
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <div class="sidebar">
            <div class="info-box">
                <div class="info-label">점수</div>
                <div id="score" class="info-value">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">레벨</div>
                <div id="level" class="info-value">1</div>
            </div>
            <div class="info-box">
                <div class="info-label">다음 블록</div>
                <canvas id="next-piece" width="80" height="80"></canvas>
            </div>
            
            <div class="info-box" style="margin-top: auto; display: none;" id="desktop-controls">
                <div class="info-label">조작법</div>
                <div style="font-size: 0.8em; color: #ccc; text-align: left; line-height: 1.6;">
                    ← → : 이동<br>
                    ↑ : 회전<br>
                    ↓ : 내리기<br>
                    Space : 한번에 내리기
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="controls-area">
        <div class="d-pad">
            <div></div>
            <div class="btn" id="btn-rotate">↻</div>
            <div></div>
            <div class="btn" id="btn-left">←</div>
            <div class="btn" id="btn-down">↓</div>
            <div class="btn" id="btn-right">→</div>
        </div>
        <div class="btn btn-large" id="btn-drop">HARD DROP</div>
    </div>

    <!-- Start/Game Over Modal -->
    <div id="modal" class="modal">
        <h1>TETRIS</h1>
        <p id="final-score" style="margin-bottom: 20px; font-size: 1.2rem; color: #fff; display: none;">최종 점수: 0</p>
        <button class="start-btn" onclick="startGame()">게임 시작</button>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece');
        const nextContext = nextCanvas.getContext('2d');
        const grid = 20;
        const nextGrid = 20;

        context.scale(grid, grid);
        nextContext.scale(nextGrid, nextGrid);

        // Colors for pieces (Standard Tetris Colors + Neon touch)
        const colors = [
            null,
            '#FF0D72', // T
            '#0DC2FF', // I
            '#0DFF72', // S
            '#F538FF', // Z
            '#FF8E0D', // L
            '#FFE138', // J
            '#3877FF', // O
        ];

        // Tetromino shapes
        const pieces = 'ILJOTSZ';
        
        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // Game State
        const arena = createMatrix(12, 20);
        
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0,
            next: null
        };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;
        let animationId;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function draw() {
            // Fill background
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Board
            drawMatrix(arena, {x: 0, y: 0}, context);

            // Draw Ghost Piece
            if (player.matrix) {
                const ghostPos = { ...player.pos };
                while (!collide(arena, { pos: ghostPos, matrix: player.matrix })) {
                    ghostPos.y++;
                }
                ghostPos.y--; // Step back one
                
                // Draw ghost with transparency/outline
                drawMatrix(player.matrix, ghostPos, context, true);
                
                // Draw Active Piece
                drawMatrix(player.matrix, player.pos, context);
            }
        }

        function drawNext() {
            nextContext.fillStyle = '#1a1a2e';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (player.next) {
                // Center the piece
                const offsetX = (4 - player.next[0].length) / 2;
                const offsetY = (4 - player.next.length) / 2;
                drawMatrix(player.next, {x: offsetX, y: offsetY}, nextContext);
            }
        }

        function drawMatrix(matrix, offset, ctx, isGhost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        if (isGhost) {
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                            ctx.lineWidth = 0.1;
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        } else {
                            // Neon Effect
                            ctx.fillStyle = colors[value];
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            
                            // Bevel/Light effect
                            ctx.lineWidth = 0.05;
                            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        }
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerReset() {
            if (player.next === null) {
                player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            }
            
            player.matrix = player.next;
            player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            drawNext();

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                gameOver();
            }
        }

        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length -1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                rowCount++;
            }
            
            if (rowCount > 0) {
                // Scoring: 100, 300, 500, 800
                const lineScores = [0, 100, 300, 500, 800];
                player.score += lineScores[rowCount] * player.level;
                player.lines += rowCount;
                
                // Level up every 5 lines (faster progression for fun)
                player.level = Math.floor(player.lines / 5) + 1;
                // Cap speed
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                
                updateScore();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }
        
        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function update(time = 0) {
            if (isPaused || isGameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            animationId = requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
        }
        
        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('final-score').style.display = 'block';
            document.getElementById('final-score').innerText = "최종 점수: " + player.score;
            document.querySelector('.modal h1').innerText = "GAME OVER";
            document.querySelector('.start-btn').innerText = "다시 하기";
        }

        function startGame() {
            // Reset Board
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            player.next = null;
            updateScore();
            dropInterval = 1000;
            
            document.getElementById('modal').style.display = 'none';
            isPaused = false;
            isGameOver = false;
            
            playerReset();
            update();
        }

        // --- Controls ---

        document.addEventListener('keydown', event => {
            if (isPaused || isGameOver) return;
            
            if (event.keyCode === 37) { // Left
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right
                playerMove(1);
            } else if (event.keyCode === 40) { // Down
                playerDrop();
            } else if (event.keyCode === 38) { // Up (Rotate)
                playerRotate(1);
            } else if (event.keyCode === 32) { // Space (Hard Drop)
                event.preventDefault(); // Prevent scrolling
                playerHardDrop();
            }
        });

        // Touch Controls
        function setupTouchBtn(id, action) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isPaused && !isGameOver) action();
            });
            // Support Mouse click for testing on desktop without keys
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (!isPaused && !isGameOver) action();
            });
        }

        setupTouchBtn('btn-left', () => playerMove(-1));
        setupTouchBtn('btn-right', () => playerMove(1));
        setupTouchBtn('btn-down', () => playerDrop());
        setupTouchBtn('btn-rotate', () => playerRotate(1));
        setupTouchBtn('btn-drop', () => playerHardDrop());

        // Check if desktop to show instructions
        if (window.innerWidth > 768) {
            document.getElementById('desktop-controls').style.display = 'block';
        }

    </script>
</body>
</html>
